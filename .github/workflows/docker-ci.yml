name: Spring Boot CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn clean package

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t vikaspatel11/spring-boot-app:latest .

      - name: Push Docker Image
        run: docker push vikaspatel11/spring-boot-app:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Pull latest image
        shell: powershell
        run: |
          docker pull vikaspatel11/spring-boot-app:latest

      - name: Stop old container
        shell: powershell
        run: |
          docker stop spring-boot-app-container 2>$null
          docker rm spring-boot-app-container 2>$null

      - name: Run new container
        shell: powershell
        run: |
          docker run -d `
            --name spring-boot-app-container `
            -p 8080:8080 `
            vikaspatel11/spring-boot-app:latest